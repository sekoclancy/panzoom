# Sections numbered, so case N is section N (Credits is unnumbered). The
# table of contents is on the right; on pages with margin figures, Quarto
# folds it into an "On this page" menu.
format:
  html:
    number-sections: true
    toc: true
# Section references (@sec-...) read "case 4", as the pages call them.
crossref:
  sec-prefix: case
