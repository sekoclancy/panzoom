project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - reference.qmd
    - tests/pages/*.qmd
  preview:
    host: 127.0.0.1
    port: 4242
    browser: false
    navigate: false

format:
  html:
    # Light and dark themes: Quarto adds a toggle to the navbar.
    theme:
      light: [flatly, light.scss]
      dark: [darkly, dark.scss]
    syntax-highlighting:
      light: a11y-light
      dark: a11y-dark
    # Long code lines wrap: a block that scrolls sideways can't be scrolled
    # from the keyboard (axe: scrollable-region-focusable).
    code-overflow: wrap

execute:
  echo: fenced
  # Re-run a page's R code only when that page's source changes.
  freeze: auto

website:
  title: "panzoom"
  site-url: https://sekoclancy.github.io/panzoom/
  repo-url: https://github.com/sekoclancy/panzoom
  navbar:
    left:
      - href: index.qmd
        text: panzoom
      - href: reference.qmd
        text: Examples
      - text: R
        menu:
          - href: tests/pages/b-panzoom-lightbox.qmd
            text: "Selected images, lightbox on"
          - href: tests/pages/c-panzoom-auto.qmd
            text: "Global panzoom"
          - href: tests/pages/d-panzoom-selective.qmd
            text: "Selected images only (default)"
          - href: tests/pages/e-formats.qmd
            text: "Image formats"
          - href: tests/pages/f-options.qmd
            text: "Options"
          - href: tests/pages/g-captions.qmd
            text: "Captions and descriptions"
          - href: tests/pages/h-wide.qmd
            text: "Wide and tall figures"
          - href: tests/pages/i-wide-galleries.qmd
            text: "Wide figures in galleries and layouts"
      - text: Python
        menu:
          - href: tests/pages/k-jupyter-auto.qmd
            text: "panzoom with lightbox"
          - href: tests/pages/l-jupyter.qmd
            text: "Cell options and svg"
      - text: Styling
        menu:
          - href: tests/pages/m-styling-options.qmd
            text: "Color options"
          - href: tests/pages/n-css-class.qmd
            text: "Styling with CSS"
    right:
      - icon: github
        href: https://github.com/sekoclancy/panzoom
        aria-label: GitHub repository
