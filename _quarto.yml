quarto-required: ">=1.8.27"

project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - examples/*.qmd
  preview:
    host: 127.0.0.1
    port: 4242
    browser: false
    navigate: false

format:
  html:
    # Light and dark themes: Quarto adds a toggle to the navbar.
    theme:
      light: [flatly, assets/light.scss]
      dark: [darkly, assets/dark.scss]
    # a11y-light and a11y-dark with their colors at WCAG AAA contrast (7:1).
    syntax-highlighting:
      light: assets/a11y-light-aaa.theme
      dark: assets/a11y-dark-aaa.theme
    # Long code lines wrap: a block that scrolls sideways can't be scrolled
    # from the keyboard (axe: scrollable-region-focusable).
    code-overflow: wrap

knitr:
  opts_chunk:
    # Plots drawn on white, not transparent (R's own png device), so their
    # black axes stay readable in the dark theme and the viewer.
    dev.args:
      bg: white

execute:
  echo: fenced
  # Re-run a page's R code only when that page's source changes.
  freeze: auto

website:
  title: "panzoom"
  site-url: https://sekoclancy.github.io/panzoom/
  repo-url: https://github.com/sekoclancy/panzoom
  # The crater of R's volcano dataset, as on the examples' heatmaps.
  favicon: assets/favicon.png
  navbar:
    left:
      - href: examples/b-mixed-r.qmd
        text: Examples
    right:
      - icon: github
        href: https://github.com/sekoclancy/panzoom
        aria-label: GitHub repository
  # The sidebar names the page, so no breadcrumbs above the title.
  bread-crumbs: false
  # The example pages, by letter.
  sidebar:
    style: docked
    contents:
      - section: "R"
        contents:
          - href: examples/a-lightbox-r.qmd
            text: "A. `lightbox` comparison (R)"
          - href: examples/b-mixed-r.qmd
            text: "B. Selected images with `lightbox` (R)"
          - href: examples/c-global-r.qmd
            text: "C. `panzoom` on every figure (R)"
          - href: examples/d-selecting-r.qmd
            text: "D. Selecting images (R)"
          - href: examples/e-image-formats-r.qmd
            text: "E. Image formats (R)"
          - href: examples/f-cell-options-r.qmd
            text: "F. Cell options (R)"
          - href: examples/g-captions-r.qmd
            text: "G. Captions and descriptions (R)"
          - href: examples/h-wide-and-tall-r.qmd
            text: "H. Wide and tall figures (R)"
          - href: examples/i-wide-galleries-r.qmd
            text: "I. Wide figures in galleries (R)"
      - section: "Python"
        contents:
          - href: examples/j-lightbox-python.qmd
            text: "J. `lightbox` comparison (Python)"
          - href: examples/k-global-python.qmd
            text: "K. `panzoom` on every figure (Python)"
          - href: examples/l-cell-options-python.qmd
            text: "L. Cell options (Python)"
          - href: examples/m-figures-python.qmd
            text: "M. Captions, formats, and shapes (Python)"
      - section: "Styling"
        contents:
          - href: examples/n-color-options-r.qmd
            text: "N. Color options (R)"
          - href: examples/o-css-r.qmd
            text: "O. Styling with CSS (R)"
      - section: "Divs"
        contents:
          - href: examples/p-divs-r.qmd
            text: "P. Divs (R)"
          - href: examples/q-divs-python.qmd
            text: "Q. Divs (Python)"
      - section: "Theme"
        contents:
          - href: examples/r-dark-plots-r.qmd
            text: "R. Dark plots (R)"
          - href: examples/s-renderings-r.qmd
            text: "S. Renderings (R)"
          - href: examples/t-renderings-python.qmd
            text: "T. Renderings (Python)"
