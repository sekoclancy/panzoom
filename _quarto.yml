quarto-required: ">=1.8.27"

project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - tests/pages/*.qmd
  preview:
    host: 127.0.0.1
    port: 4242
    browser: false
    navigate: false

format:
  html:
    # Light and dark themes: Quarto adds a toggle to the navbar.
    theme:
      light: [flatly, assets/light.scss]
      dark: [darkly, assets/dark.scss]
    # a11y-light and a11y-dark with their colors at WCAG AAA contrast (7:1).
    syntax-highlighting:
      light: assets/a11y-light-aaa.theme
      dark: assets/a11y-dark-aaa.theme
    # Long code lines wrap: a block that scrolls sideways can't be scrolled
    # from the keyboard (axe: scrollable-region-focusable).
    code-overflow: wrap
    # The table of contents is named by its title (see the file).
    template-partials:
      - _partials/toc.html

knitr:
  opts_chunk:
    # Plots drawn on white, not transparent (R's own png device), so their
    # black axes stay readable in the dark theme and the viewer.
    dev.args:
      bg: white

execute:
  echo: fenced
  # Re-run a page's R code only when that page's source changes.
  freeze: auto

website:
  title: "panzoom"
  site-url: https://sekoclancy.github.io/panzoom/
  repo-url: https://github.com/sekoclancy/panzoom
  # The crater of R's volcano dataset, as on the examples' heatmaps.
  favicon: assets/favicon.png
  navbar:
    left:
      - href: tests/pages/b-panzoom-lightbox.qmd
        text: Examples
    right:
      - icon: github
        href: https://github.com/sekoclancy/panzoom
        aria-label: GitHub repository
  # The sidebar names the page, so no breadcrumbs above the title.
  bread-crumbs: false
  # The example pages, by letter.
  sidebar:
    style: docked
    contents:
      - section: "R"
        contents:
          - href: tests/pages/a-lightbox.qmd
            text: "A. `lightbox` comparison"
          - href: tests/pages/b-panzoom-lightbox.qmd
            text: "B. Selected images with `lightbox`"
          - href: tests/pages/c-panzoom-auto.qmd
            text: "C. `panzoom` on every figure"
          - href: tests/pages/d-panzoom-selective.qmd
            text: "D. Selected images only"
          - href: tests/pages/e-formats.qmd
            text: "E. Image formats"
          - href: tests/pages/f-options.qmd
            text: "F. Cell options"
          - href: tests/pages/g-captions.qmd
            text: "G. Captions and descriptions"
          - href: tests/pages/h-wide.qmd
            text: "H. Wide and tall figures"
          - href: tests/pages/i-wide-galleries.qmd
            text: "I. Wide figures in galleries"
      - section: "Python"
        contents:
          - href: tests/pages/j-jupyter-lightbox.qmd
            text: "J. `lightbox` comparison"
          - href: tests/pages/k-jupyter-auto.qmd
            text: "K. `panzoom` on every figure"
          - href: tests/pages/l-jupyter.qmd
            text: "L. Cell options"
          - href: tests/pages/m-jupyter-figures.qmd
            text: "M. Captions, formats, and shapes"
      - section: "Styling"
        contents:
          - href: tests/pages/n-styling-options.qmd
            text: "N. Color options"
          - href: tests/pages/o-css-class.qmd
            text: "O. Styling with CSS"
      - section: "Divs"
        contents:
          - href: tests/pages/p-divs.qmd
            text: "P. Divs in R"
          - href: tests/pages/q-jupyter-divs.qmd
            text: "Q. Divs in Python"
      - section: "Theme"
        contents:
          - href: tests/pages/r-dark-plots.qmd
            text: "R. Dark plots"
          - href: tests/pages/s-renderings.qmd
            text: "S. Renderings in R"
          - href: tests/pages/t-jupyter-renderings.qmd
            text: "T. Renderings in Python"
