$-- Quarto 1.10's toc.html, plus aria-labelledby: the table of contents is
$-- then a navigation landmark named by its title ("On this page"), not a
$-- second unnamed one next to the navbar (axe: landmark-unique).
<nav id="$idprefix$TOC" role="doc-toc"$if(toc-title)$ aria-labelledby="$idprefix$toc-title"$endif$>
  $if(toc-title)$
  <h2 id="$idprefix$toc-title">$toc-title$</h2>
  $endif$ 
  $table-of-contents$
</nav>
